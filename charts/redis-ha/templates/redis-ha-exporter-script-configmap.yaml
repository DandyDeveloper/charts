{{- if .Values.exporter.script }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "redis-ha.fullname" . }}-exporter-script-configmap
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "redis-ha.labels" (dict "context" . "customLabels" (list .Values.extraLabels)) | indent 4 }}
data:
  script: {{ toYaml .Values.exporter.script | indent 2 }}
{{- end }}
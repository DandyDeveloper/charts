{{- if .Values.haproxy.enabled }}
{{- if and .Values.haproxy.serviceAccount.create .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "redis-ha.fullname" . }}-haproxy
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "redis-ha.labels" (dict "context" . "defaults" (dict "component" "haproxy" "app.kubernetes.io/component" "haproxy") "customLabels" (list .Values.extraLabels)) | indent 4 }}
rules:
- apiGroups:
    - ""
  resources:
    - endpoints
  verbs:
    - get
# EndpointSlices supersede the Endpoints API, which is deprecated as of Kubernetes v1.33.
- apiGroups:
    - discovery.k8s.io
  resources:
    - endpointslices
  verbs:
    - get
{{- end }}
{{- end }}

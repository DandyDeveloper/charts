apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "redis-ha.fullname" . }}-health-configmap
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "redis-ha.labels" (dict "context" . "defaults" (dict "app" (include "redis-ha.fullname" .) "app.kubernetes.io/name" (include "redis-ha.fullname" .)) "customLabels" (list .Values.extraLabels)) | indent 4 }}
data:
  redis_liveness.sh: |
{{- include "redis_liveness.sh" . }}
  redis_readiness.sh: |
{{- include "redis_readiness.sh" . }}
  sentinel_liveness.sh: |
{{- include "sentinel_liveness.sh" . }}
